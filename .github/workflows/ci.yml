name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.3' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: php -l
        run: |
          status=0
          while IFS= read -r -d '' f; do php -l "$f" > /dev/null || status=1; done < <(find . -name '*.php' -not -path './build/*' -print0)
          exit $status
      - name: Watch-only and upgrade tests
        run: php tests/run.php

  plugin-check:
    name: Plugin Check (WordPress.org build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WordPress.org package
        run: bin/build-zip.sh all-in-crawler-ai-agent-manager
      - uses: actions/upload-artifact@v4
        with:
          name: all-in-crawler-ai-agent-manager-wporg-zip
          path: build/all-in-crawler-ai-agent-manager.zip
      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/all-in-crawler-ai-agent-manager
          slug: all-in-crawler-ai-agent-manager
          # Warnings are shown as annotations; errors fail the job.
          ignore-warnings: true
